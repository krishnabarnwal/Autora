<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Autora">
  <!-- Zero-dependency monogram. The ring reads as the closed autonomous loop;
       the mark inside it is Autora's "A". Palette matches the dashboard:
       ink-950 field, signal-green loop, near-white letter. -->
  <rect width="64" height="64" rx="14" fill="#07090f" />
  <circle
    cx="32"
    cy="32"
    r="22"
    fill="none"
    stroke="#4ade80"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="118 20"
    transform="rotate(-90 32 32)"
  />
  <path
    d="M23 43 L32 20 L41 43 M26.5 35.5 H37.5"
    fill="none"
    stroke="#f5f7fa"
    stroke-width="3.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
